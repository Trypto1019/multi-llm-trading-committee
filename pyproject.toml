[project]
name = "multi-llm-trading-committee"
version = "0.1.0"
description = "LLMs propose, deterministic code disposes: a paper-traded multi-model trading committee (engineering showcase, no alpha claimed)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools]
packages = ["agents", "audit", "committee", "consensus", "debate", "providers", "risk_marshal", "rules", "stops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
